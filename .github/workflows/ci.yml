name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (NATS core)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  node:
    name: Node.js (packages)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run shared package tests
        run: npm test

      - name: Check syntax (packages)
        run: |
          node --check packages/relay/server.js
          node --check packages/relay/session-watcher.js
          node --check packages/relay/send.js
          node --check packages/relay/groups.js
          node --check packages/daemon/agent-daemon.js
          node --check packages/mcp-server/mcp-server.js
          node --check packages/fleet-log/fleet-log-writer.js
          node --check packages/shared/index.js
          node --check packages/shared/config.js
          node --check packages/shared/nats-helpers.js
          node --check packages/shared/wire-protocol.js

      - name: Check scripts syntax
        run: |
          node --check scripts/kanban-notify.js

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JSON validity
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          for pkg in packages/*/package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$pkg'))"
          done

      - name: Check YAML frontmatter in expeditions
        run: |
          for f in kanban-work/expeditions/*.md; do
            if head -1 "$f" | grep -q '^---'; then
              echo "OK $f has frontmatter"
            else
              echo "FAIL $f missing frontmatter" && exit 1
            fi
          done

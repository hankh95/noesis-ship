# Yurtle Kanban Configuration for Noesis Ship

board_name: "Noesis Ship Development"
default_branch: main

# ID prefix for expeditions (using EXP to align with nusy-product-team)
id_prefix: "EXP"

# Work directory
work_dir: "kanban-work/expeditions"

# Columns
columns:
  - backlog
  - ready
  - in-progress
  - review
  - done

# Default priority
default_priority: medium

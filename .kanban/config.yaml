# yurtle-kanban configuration
kanban:
  theme: nautical

  paths:
    root: kanban-work/
    scan_paths:
    - "kanban-work/expeditions/"
    - "kanban-work/features/"
    - "kanban-work/tasks/"
    - "kanban-work/bugs/"

  ignore:
    - "**/archive/**"
    - "**/templates/**"
    - "**/_TEMPLATE*"

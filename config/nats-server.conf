# NATS Server Configuration for Noesis Ship
# DGX deployment

# Network
listen: 0.0.0.0:4222
http: 0.0.0.0:8222  # Monitoring port

# JetStream (persistent messaging)
jetstream {
    store_dir: __HOME__/projects/noesis-ship/data/jetstream
    max_mem: 1G
    max_file: 10G
}

# Limits
max_payload: 10MB
max_connections: 1000
ping_interval: 30s
ping_max: 3

# Logging
debug: false
trace: false
logtime: true
log_file: __HOME__/projects/noesis-ship/logs/nats-server.log
